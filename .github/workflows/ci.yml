name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Lint UI
        run: pnpm run lint:ui
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test
        run: pnpm test
      - name: Seed SQLite
        run: pnpm run seed
      - name: Build
        run: pnpm run build
      - name: Playwright install
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright
        run: pnpm run test:e2e
        env:
          AVALUNA_SESSION_SECRET: local-ci-session-secret-not-for-prod
          AVALUNA_SETTINGS_SECRET: local-ci-settings-secret-not-for-prod
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
